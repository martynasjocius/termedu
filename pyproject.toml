[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termedu"
version = "0.1.0"
description = "Terminal-based arithmetic learning app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
termedu = "termedu.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
